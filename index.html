<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAN PATRIA GRANDE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px 8px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            z-index: 10;
        }

        .button-group {
            background: #010409;
            padding: 4px;
            border-radius: 10px;
            display: inline-flex;
            gap: 4px;
            border: 1px solid #30363d;
        }

        .btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn.active { background: #b91c1c; color: #fff; }

        /* Panel Editor Secreto */
        .color-picker-tool {
            display: none;
            background: #010409;
            border: 1px solid #30363d;
            padding: 4px 10px;
            border-radius: 10px;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .color-picker-tool input[type="color"] {
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        #map-container {
            width: 100%;
            height: calc(100vh - 100px);
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #map-container svg {
            width: 100%;
            height: 100%;
            display: block;
            transform-origin: 0 0;
            cursor: grab;
        }

        #map-container svg text, #map-container svg tspan { fill: #ffffff !important; }
        #map-container svg path { stroke-linecap: round; stroke-linejoin: round; }
        #map-container svg path:hover { stroke: #000000 !important; cursor: pointer; filter: brightness(1.1); }

        .map-tooltip {
            position: fixed;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid #dc2626;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            display: none;
            z-index: 1000;
            transform: translate(-50%, -120%);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="button-group">
            <button class="btn active" id="btn-bolivia" onclick="cargarMapa('bolivia')">Bolivianos</button>
            <button class="btn" id="btn-paraguay" onclick="cargarMapa('paraguay')">Paraguayos</button>
            <button class="btn" id="btn-peru" onclick="cargarMapa('peru')">Peruanos</button>
        </div>

        <!-- Panel Editor Secreto -->
        <div class="color-picker-tool" id="editor-panel">
            <label for="paintColor">Pincel:</label>
            <input type="color" id="paintColor" value="#b91c1c">
            <button class="btn" onclick="exportarSVG()" style="background:#238636; color:#fff;">Guardar SVG</button>
        </div>
    </div>

    <div id="map-container">
        <div style="color: #9ca3af;">Cargando mapa...</div>
    </div>

    <div id="tooltip" class="map-tooltip"></div>

    <script>
        const URL_BOLIVIA = './Bolivianos_en_Argentina_(2022).svg';
        const URL_PARAGUAY = './Paraguayos_en_Argentina_(2022).svg';
        const URL_PERU = './Peruanos_en_Argentina_(2022).svg';

        const urlParams = new URLSearchParams(window.location.search);
        const esModoEditor = urlParams.get('editor') === 'true';

        let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0;
        let isDragging = false, initialPinchDist = 0, initialScale = 1;
        let listenersAsignados = false;
        const MAX_ZOOM = 120;

        if (esModoEditor) {
            document.getElementById('editor-panel').style.display = 'flex';
        }

        async function cargarMapa(pais) {
            const container = document.getElementById('map-container');
            document.querySelectorAll('.button-group .btn').forEach(b => b.classList.remove('active'));
            
            let url = URL_BOLIVIA;
            if (pais === 'bolivia') { document.getElementById('btn-bolivia').classList.add('active'); url = URL_BOLIVIA; }
            if (pais === 'paraguay') { document.getElementById('btn-paraguay').classList.add('active'); url = URL_PARAGUAY; }
            if (pais === 'peru') { document.getElementById('btn-peru').classList.add('active'); url = URL_PERU; }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar');
                let svgCode = await response.text();

                requestAnimationFrame(() => {
                    container.innerHTML = svgCode;
                    const svg = container.querySelector('svg');
                    if (svg) {
                        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                        resetearZoom(svg);
                        configurarInteraccionPath(svg);
                    }
                    if (!listenersAsignados) {
                        configurarEventosGlobales(container);
                        listenersAsignados = true;
                    }
                });
            } catch (err) {
                container.innerHTML = `<div style="color:#ef4444">Error al cargar mapa.</div>`;
            }
        }

        // Convierte color RGB devuelto por el navegador a formato Hexadecimal para el input type="color"
        function rgbToHex(rgbStr) {
            if (!rgbStr || rgbStr === 'none' || rgbStr === 'transparent') return '#ffffff';
            if (rgbStr.startsWith('#')) return rgbStr;

            const rgbValues = rgbStr.match(/\d+/g);
            if (!rgbValues || rgbValues.length < 3) return '#ffffff';

            const r = parseInt(rgbValues[0]).toString(16).padStart(2, '0');
            const g = parseInt(rgbValues[1]).toString(16).padStart(2, '0');
            const b = parseInt(rgbValues[2]).toString(16).padStart(2, '0');

            return `#${r}${g}${b}`;
        }

        function configurarInteraccionPath(svg) {
            const tooltip = document.getElementById('tooltip');
            const paths = svg.querySelectorAll('path');

            paths.forEach(path => {
                // CLIC IZQUIERDO: Pintar (Modo Editor) o Seleccionar (Modo Viewer)
                path.onclick = (e) => {
                    e.stopPropagation();

                    if (esModoEditor) {
                        const colorSeleccionado = document.getElementById('paintColor').value;
                        path.style.setProperty('fill', colorSeleccionado, 'important');
                    } else {
                        paths.forEach(p => p.classList.remove('selected'));
                        path.classList.add('selected');
                    }

                    mostrarTooltip(e, path);
                };

                // CLIC DERECHO: Cuentagotas (Copiar color del departamento al pincel)
                path.oncontextmenu = (e) => {
                    if (!esModoEditor) return;
                    e.preventDefault(); // Evita que se abra el menú contextual del navegador
                    e.stopPropagation();

                    // Obtiene el color real computado del path
                    const computedStyle = window.getComputedStyle(path);
                    const colorActual = path.style.fill || computedStyle.fill;
                    
                    const hexColor = rgbToHex(colorActual);
                    document.getElementById('paintColor').value = hexColor;

                    mostrarTooltip(e, path, `Color copiado: ${hexColor}`);
                };
            });
        }

        function mostrarTooltip(e, path, textoAdicional = '') {
            const tooltip = document.getElementById('tooltip');
            const rawName = path.querySelector('title')?.textContent || path.getAttribute('name') || path.getAttribute('id') || '';
            
            if (rawName) {
                tooltip.textContent = textoAdicional ? `${rawName} (${textoAdicional})` : rawName;
                tooltip.style.display = 'block';
                tooltip.style.left = `${e.clientX || e.touches[0].clientX}px`;
                tooltip.style.top = `${(e.clientY || e.touches[0].clientY) - 15}px`;
            }
        }

        function exportarSVG() {
            const container = document.getElementById('map-container');
            const svg = container.querySelector('svg');
            if (!svg) return;

            const svgData = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'mapa_editado.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetearZoom(svg) {
            scale = 1; pointX = 0; pointY = 0;
            aplicarTransformacion(svg);
        }

        function aplicarTransformacion(svg) {
            svg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            const strokeWidth = Math.max(0.2 / scale, 0.1);
            svg.querySelectorAll('path').forEach(p => {
                p.style.setProperty('stroke', '#101010', 'important');
                p.style.setProperty('stroke-width', `${strokeWidth}px`, 'important');
            });
        }

        function getDistance(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
        function getMidpoint(t) { return { x: (t[0].clientX + t[1].clientX)/2, y: (t[0].clientY + t[1].clientY)/2 }; }

        function configurarEventosGlobales(container) {
            container.addEventListener('wheel', (e) => {
                const svg = container.querySelector('svg');
                if (!svg) return;
                e.preventDefault();
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
                const factor = e.deltaY < 0 ? 1.25 : 0.8;
                const newScale = Math.min(Math.max(1, scale * factor), MAX_ZOOM);

                if (newScale !== scale) {
                    pointX = mouseX - (mouseX - pointX) * (newScale / scale);
                    pointY = mouseY - (mouseY - pointY) * (newScale / scale);
                    scale = newScale;
                    if (scale === 1) { pointX = 0; pointY = 0; }
                    aplicarTransformacion(svg);
                }
            }, { passive: false });

            container.addEventListener('mousedown', (e) => {
                // Solo inicia arrastre con clic izquierdo (button 0)
                if (scale > 1 && e.button === 0) { 
                    isDragging = true; 
                    startX = e.clientX - pointX; 
                    startY = e.clientY - pointY; 
                }
            });

            window.addEventListener('mousemove', (e) => {
                const svg = container.querySelector('svg');
                if (!isDragging || !svg) return;
                pointX = e.clientX - startX; pointY = e.clientY - startY;
                aplicarTransformacion(svg);
            });

            window.addEventListener('mouseup', () => isDragging = false);

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true; startX = e.touches[0].clientX - pointX; startY = e.touches[0].clientY - pointY;
                } else if (e.touches.length === 2) {
                    isDragging = false; initialPinchDist = getDistance(e.touches); initialScale = scale;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                const svg = container.querySelector('svg');
                if (!svg) return;
                if (e.touches.length === 1 && isDragging && scale > 1) {
                    pointX = e.touches[0].clientX - startX; pointY = e.touches[0].clientY - startY;
                    aplicarTransformacion(svg);
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    const dist = getDistance(e.touches);
                    if (initialPinchDist === 0) return;
                    const newScale = Math.min(Math.max(1, initialScale * (dist / initialPinchDist)), MAX_ZOOM);
                    if (newScale !== scale) {
                        const rect = container.getBoundingClientRect();
                        const mid = getMidpoint(e.touches);
                        const mouseX = mid.x - rect.left, mouseY = mid.y - rect.top;
                        pointX = mouseX - (mouseX - pointX) * (newScale / scale);
                        pointY = mouseY - (mouseY - pointY) * (newScale / scale);
                        scale = newScale;
                        if (scale === 1) { pointX = 0; pointY = 0; }
                        aplicarTransformacion(svg);
                    }
                }
            }, { passive: false });

            container.addEventListener('touchend', () => isDragging = false);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('path')) document.getElementById('tooltip').style.display = 'none';
        });

        cargarMapa('bolivia');
    </script>
</body>
</html>
