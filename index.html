<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        /* Estilo para la barra de botones basada en tu referencia */
        .button-group {
            background: #111827;
            padding: 4px;
            border-radius: 12px;
            display: inline-flex;
            gap: 4px;
            border: 1px solid #1f2937;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 8px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        .btn.active {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .btn:hover:not(.active) {
            color: #ffffff;
        }

        /* Contenedor responsivo para el SVG */
        #map-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        #map-container svg {
            width: 100%;
            height: auto;
            max-height: 85vh;
            display: block;
        }

        /* Indicador de carga */
        .loading {
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Botones de navegación -->
    <div class="button-group">
        <button class="btn" id="btn-bolivia" onclick="cargarMapa('bolivia')">Bolivia</button>
        <button class="btn" id="btn-paraguay" onclick="cargarMapa('paraguay')">Paraguay</button>
    </div>

    <!-- ÁREA DONDE SE RENDERIZA EL SVG DE TU GIST -->
    <div id="map-container">
        <div class="loading">Cargando mapa...</div>
    </div>

    <script>
        // Enlaces en bruto (raw) desde tu Gist de GitHub
        const URL_BOLIVIA = 'https://gist.githubusercontent.com/planpatriagrande/4101eaeac508e4a65d239ada4b516466/raw/gistfile1.txt';
        const URL_PARAGUAY = URL_BOLIVIA; // Reemplazar con el enlace raw de Paraguay si subes otro Gist

        async function cargarMapa(pais) {
            const container = document.getElementById('map-container');
            const btnBolivia = document.getElementById('btn-bolivia');
            const btnParaguay = document.getElementById('btn-paraguay');

            // Actualizar clase activa en los botones
            if (pais === 'bolivia') {
                btnBolivia.classList.add('active');
                btnParaguay.classList.remove('active');
            } else {
                btnParaguay.classList.add('active');
                btnBolivia.classList.remove('active');
            }

            const url = (pais === 'bolivia') ? URL_BOLIVIA : URL_PARAGUAY;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar el SVG');
                const svgCode = await response.text();
                container.innerHTML = svgCode;
            } catch (error) {
                container.innerHTML = `<div class="loading" style="color: #ef4444;">Error al cargar el mapa.</div>`;
                console.error(error);
            }
        }

        // Cargar mapa por defecto (Bolivia)
        cargarMapa('bolivia');
    </script>
</body>
</html>
