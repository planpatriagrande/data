<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAN PATRIA GRANDE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        /* Botones de navegación */
        .button-group {
            background: #111827;
            padding: 5px;
            border-radius: 12px;
            display: inline-flex;
            gap: 4px;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }

        .btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        .btn.active {
            background: #b91c1c; /* Rojo plano sin sombra */
            color: #ffffff;
        }

        .btn:hover:not(.active) {
            color: #ffffff;
        }

        /* Contenedor del mapa */
        #map-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }

        #map-container svg {
            width: 100%;
            height: auto;
            max-height: 85vh;
            display: block;
        }

        /* Forzar texto blanco */
        #map-container svg text,
        #map-container svg tspan {
            fill: #ffffff !important;
        }

        /* Bordes (stroke) en departamentos y ciudades */
        #map-container svg path {
            stroke: #1f2937 !important;
            stroke-width: 0.3px !important;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: fill 0.2s ease, stroke-width 0.2s ease;
        }

        #map-container svg path:hover {
            stroke: #ffffff !important;
            stroke-width: 1px !important;
            cursor: pointer;
        }

        .loading {
            color: #9ca3af;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="button-group">
        <button class="btn" id="btn-bolivia" onclick="cargarMapa('bolivia')">Bolivianos</button>
        <button class="btn" id="btn-paraguay" onclick="cargarMapa('paraguay')">Paraguayos</button>
        <button class="btn" id="btn-peru" onclick="cargarMapa('peru')">Peruanos</button>
    </div>

    <div id="map-container">
        <div class="loading">Cargando mapa...</div>
    </div>

    <script>
        const URL_BOLIVIA = './Bolivianos_en_Argentina_(2022).svg';
        const URL_PARAGUAY = './Paraguayos_en_Argentina_(2022).svg';
        const URL_PERU = './Peruanos_en_Argentina_(2022).svg';

        // Reemplazo de escala de verdes por rojos
        const tablaColores = {
            '#edf8e9': '#fca5a5',
            '#c7e9c0': '#f87171',
            '#a1d99b': '#ef4444',
            '#74c476': '#dc2626',
            '#31a354': '#b91c1c',
            '#006d2c': '#7f1d1d'
        };

        async function cargarMapa(pais) {
            const container = document.getElementById('map-container');
            const btnBolivia = document.getElementById('btn-bolivia');
            const btnParaguay = document.getElementById('btn-paraguay');
            const btnPeru = document.getElementById('btn-peru');

            // Desactivar todos los botones
            btnBolivia.classList.remove('active');
            btnParaguay.classList.remove('active');
            btnPeru.classList.remove('active');

            let url = URL_BOLIVIA;

            // Activar el botón seleccionado y asignar la URL correspondiente
            if (pais === 'bolivia') {
                btnBolivia.classList.add('active');
                url = URL_BOLIVIA;
            } else if (pais === 'paraguay') {
                btnParaguay.classList.add('active');
                url = URL_PARAGUAY;
            } else if (pais === 'peru') {
                btnPeru.classList.add('active');
                url = URL_PERU;
            }

            container.innerHTML = `<div class="loading">Cargando mapa...</div>`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar el SVG');
                let svgCode = await response.text();

                Object.keys(tablaColores).forEach(verde => {
                    const rojo = tablaColores[verde];
                    const regex = new RegExp(verde, 'gi');
                    svgCode = svgCode.replace(regex, rojo);
                });

                container.innerHTML = svgCode;
            } catch (error) {
                container.innerHTML = `<div class="loading" style="color: #ef4444;">Error al cargar el mapa.</div>`;
                console.error(error);
            }
        }

        cargarMapa('bolivia');
    </script>
</body>
</html>
